# Publishes the front end (public/) to GitHub Pages.
#
# Pages serves static files only — it cannot run the API — so the published page
# talks to the API deployed elsewhere. Set the repository variable API_BASE_URL
# to that origin (Settings -> Secrets and variables -> Actions -> Variables), or:
#
#   gh variable set API_BASE_URL --body "https://your-app.vercel.app"
#
# The API must also allow this origin: set ALLOWED_ORIGINS on the API deployment
# to https://<owner>.github.io
name: Deploy front end to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Point the front end at the API
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::API_BASE_URL is not set — the published page will explain that it is unconfigured rather than working."
          fi
          cat > public/config.js <<CONFIG
          // Generated by .github/workflows/pages.yml — do not edit here.
          window.KNOKNOK_API_BASE = "${API_BASE_URL}";
          CONFIG
          cat public/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
